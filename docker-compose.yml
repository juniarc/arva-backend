# Local PostgreSQL for development and tests.
# Creates the "arva" database, plus "arva_test" via docker/init-test-db.sql.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arva
      POSTGRES_PASSWORD: arva
      POSTGRES_DB: arva
    ports:
      - "5432:5432"
    volumes:
      - arva_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  arva_pgdata:
